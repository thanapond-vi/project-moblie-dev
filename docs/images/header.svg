<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" role="img" aria-label="KEEP: a warm reading lamp glowing over an open book">
  <defs>
    <radialGradient id="lamp" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#34D399" stop-opacity=".34"/>
      <stop offset=".45" stop-color="#FBBF24" stop-opacity=".2"/>
      <stop offset="1" stop-color="#FBBF24" stop-opacity="0"/>
    </radialGradient>
    <style>
      .breathe { animation: breathe 6s ease-in-out infinite; transform-origin: 600px 140px; }
      .drift { animation: drift 14s ease-in-out infinite; }
      .line { animation: write 4s ease-out infinite; stroke-dasharray: 220; }
      .l2 { animation-delay: .6s; } .l3 { animation-delay: 1.2s; }
      @keyframes breathe { 0%, 100% { opacity: .75; transform: scale(1); } 50% { opacity: 1; transform: scale(1.08); } }
      @keyframes drift { 0%, 100% { transform: translateX(-30px); } 50% { transform: translateX(30px); } }
      @keyframes write { 0% { stroke-dashoffset: 220; } 45%, 100% { stroke-dashoffset: 0; } }
      @media (prefers-reduced-motion: reduce) { .breathe, .drift, .line { animation: none; } }
      text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <!-- charcoal desk with a soft lamp glow that breathes, like the reading screen in the app -->
  <rect width="1200" height="300" fill="#121413"/>
  <g class="drift"><ellipse class="breathe" cx="600" cy="140" rx="520" ry="230" fill="url(#lamp)"/></g>

  <!-- open book -->
  <g transform="translate(600 205)">
    <path d="M-150 -6 Q-75 -26 0 -6 V40 Q-75 22 -150 40 Z" fill="#F6F1E7"/>
    <path d="M150 -6 Q75 -26 0 -6 V40 Q75 22 150 40 Z" fill="#E9E6DF"/>
    <path d="M0 -6 V40" stroke="#1F2421" stroke-opacity=".35" stroke-width="2"/>
    <g stroke="#2E7D6B" stroke-width="3" stroke-linecap="round" fill="none" opacity=".7">
      <path class="line" d="M-128 6 Q-75 -6 -22 6"/>
      <path class="line l2" d="M-128 18 Q-75 6 -22 18"/>
      <path class="line l3" d="M22 6 Q75 -6 128 6"/>
    </g>
  </g>

  <text x="600" y="118" text-anchor="middle" font-size="76" font-weight="800" letter-spacing="14" fill="#E9E6DF">KEEP</text>
  <text x="600" y="156" text-anchor="middle" font-size="22" letter-spacing="3" fill="#34D399">READ · RECALL · REFLECT</text>
</svg>
